# هر پوش به شاخهٔ main این فایل را اجرا می‌کند:
# ایمیج تازه می‌سازد، سرویس سایت و Cloud Run Job رندر را با همان ایمیج عوض می‌کند.
# متغیرهای محیطی و دستور جاب دست نمی‌خورند؛ فقط ایمیج عوض می‌شود.
substitutions:
  _REGION: us-central1
  _AR: behix
  _SERVICE: behix-pro-engine
  _JOB: behix-render-job

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR}/engine:$SHORT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR}/engine:latest
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR}/engine

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        IMAGE="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR}/engine:$SHORT_SHA"
        echo "ایمیج: $$IMAGE"
        gcloud run services update "${_SERVICE}" --image "$$IMAGE" --region "${_REGION}"
        gcloud run jobs update "${_JOB}" --image "$$IMAGE" --region "${_REGION}"
        echo "سرویس ${_SERVICE} و جاب ${_JOB} هر دو روی $$IMAGE هستند"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR}/engine:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR}/engine:latest
